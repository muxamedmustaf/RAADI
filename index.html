<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة الإعلانات - RAADI</title>
    <!-- روابط التنسيق -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- رأس الصفحة -->
    <header class="main-header">
        <div class="container">
            <h1>منصة الإعلانات</h1>
            <nav>
                <a href="index.html" class="active">الرئيسية</a>
                <a href="add-listing.html">نشر إعلان جديد</a>
            </nav>
        </div>
    </header>

    <!-- قسم البحث والفلترة -->
    <section class="search-section">
        <div class="container">
            <form id="search-form" class="search-form">
                <div class="form-group">
                    <label for="search-keyword">كلمات البحث</label>
                    <input type="text" id="search-keyword" placeholder="ابحث في العنوان أو الوصف...">
                </div>

                <div class="form-group">
                    <label for="search-city">المدينة أو المنطقة</label>
                    <input type="text" id="search-city" placeholder="مثال: Galkacyo">
                </div>

                <div class="form-group">
                    <label for="search-category">التصنيف</label>
                    <select id="search-category">
                        <option value="all">جميع التصنيفات</option>
                        <option value="real-estate">عقارات</option>
                        <option value="vehicles">مركبات</option>
                        <option value="electronics">إلكترونيات</option>
                    </select>
                </div>

                <button type="submit" class="btn-search">ابحث</button>
            </form>
        </div>
    </section>

    <!-- قسم عرض الإعلانات (الحاوية الأساسية التي ينتظرها الجافاسكريبت) -->
    <main class="container main-content">
        <h2>الإعلانات المتاحة</h2>
        
        <!-- الحاوية المسؤولة عن طباعة البطاقات برمجياً -->
        <div id="listings-container" class="listings-grid">
            <div class="loading">جاري تحميل الإعلانات...</div>
        </div>
    </main>

    <!-- تذييل الصفحة -->
    <footer class="main-footer">
        <div class="container">
            <p>جميع الحقوق محفوظة © منصة RAADI</p>
        </div>
    </footer>

    <!-- استدعاء مكتبة Supabase والملفات البرمجية بالترتيب الصحيح -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase.js"></script>
    <script src="script.js"></script>

</body>
</html>
