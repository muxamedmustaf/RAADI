
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0f766e">
  <title>إضافة إعلان | RAADI</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>

  <header class="site-header">
    <a href="index.html" class="logo">رَادي <span>RAADI</span></a>
    <nav>
      <a href="index.html#categories">التصنيفات</a>
      <a href="index.html#listings">الإعلانات</a>
      <a href="index.html#about">عن المنصة</a>
    </nav>
    <a href="index.html" class="header-button">العودة للرئيسية</a>
  </header>

  <main>
    <section class="section">
      <div class="section-heading">
        <div>
          <span class="eyebrow">بيع بسهولة</span>
          <h2>إضافة إعلان جديد</h2>
        </div>
      </div>

      <form id="listing-form" class="listing-form">
        <div class="form-group">
          <label for="title">عنوان الإعلان</label>
          <input id="title" name="title" type="text"
            placeholder="مثال: هاتف سامسونج مستعمل" required>
        </div>

        <div class="form-group">
          <label for="category">الفئة</label>
          <select id="category" name="category" required>
            <option value="">اختر الفئة</option>
            <option value="phones">الهواتف</option>
            <option value="computers">الحواسيب</option>
            <option value="electronics">الإلكترونيات</option>
            <option value="land">الأراضي الخام</option>
          </select>
        </div>

        <div class="form-group">
          <label for="price">السعر بالدولار</label>
          <input id="price" name="price" type="number"
            min="0" step="0.01" placeholder="مثال: 150" required>
        </div>

        <div class="form-group">
          <label for="city">المدينة أو المنطقة</label>
          <input id="city" name="city" type="text"
            placeholder="مثال: بوصاصو" required>
        </div>

        <div class="form-group">
          <label for="description">تفاصيل الإعلان</label>
          <textarea id="description" name="description"
            rows="5" placeholder="اكتب تفاصيل المنتج أو الأرض..." required></textarea>
        </div>

        <div class="form-group">
          <label for="phone">رقم واتساب للتواصل</label>
          <input id="phone" name="phone" type="tel"
            placeholder="أدخل رقم واتساب مع رمز الدولة" required>
        </div>

        <div class="form-group">
          <label for="images">صور الإعلان</label>
          <input id="images" name="images" type="file"
            accept="image/*" multiple>
          <small>يمكنك اختيار أكثر من صورة.</small>
        </div>

        <button type="submit" class="primary-button">
          إرسال الإعلان للمراجعة
        </button>

        <p id="form-message" class="form-message" aria-live="polite"></p>
      </form>
    </section>
  </main>

  <footer class="site-footer">
    <a href="index.html" class="logo">رَادي <span>RAADI</span></a>
    <p>منصة رَادي للإعلانات المحلية</p>
    <small>© 2026 RAADI</small>
  </footer>

</body>
</html>
