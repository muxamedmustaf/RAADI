<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة الإعلانات المحلية - RAADI</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- شريط التنقل العلوي -->
    <header class="main-header">
        <div class="container" style="display: flex; justify-content: space-between; align-items: center; padding: 15px; background: #2b6cb0; color: #fff;">
            <h1 class="logo" style="margin: 0; font-size: 22px;">منصة RAADI</h1>
            <nav class="nav-links">
                <a href="index.html" style="color: #fff; margin-left: 15px; text-decoration: none; font-weight: bold;">الرئيسية</a>
                <a href="add-listing.html" style="background: #319795; color: #fff; padding: 8px 15px; border-radius: 5px; text-decoration: none;">نشر إعلان جديد</a>
            </nav>
        </div>
    </header>

    <!-- قسم البحث والفلترة -->
    <section class="search-section" style="padding: 20px; background: #f7fafc; margin-bottom: 20px;">
        <div class="container">
            <h3>ابحث عما تريده بسهولة</h3>
            <form id="search-form" style="display: flex; gap: 10px; flex-wrap: wrap; margin-top: 10px;">
                <input type="text" id="search-keyword" placeholder="ابحث في العنوان أو الوصف..." style="padding: 8px; flex: 1; min-width: 200px; border: 1px solid #cbd5e0; border-radius: 4px;">
                <input type="text" id="search-city" placeholder="المدينة (مثال: Galkacyo)" style="padding: 8px; flex: 1; min-width: 150px; border: 1px solid #cbd5e0; border-radius: 4px;">
                <select id="search-category" style="padding: 8px; border: 1px solid #cbd5e0; border-radius: 4px;">
                    <option value="all">جميع التصنيفات</option>
                    <option value="real-estate">عقارات</option>
                    <option value="vehicles">مركبات</option>
                    <option value="electronics">إلكترونيات</option>
                </select>
                <button type="submit" style="padding: 8px 20px; background: #2b6cb0; color: #fff; border: none; border-radius: 4px; cursor: pointer;">بحث</button>
            </form>
        </div>
    </section>

    <!-- قسم عرض الإعلانات الجلّاب -->
    <main class="container main-content" style="padding: 0 20px;">
        <h2>الإعلانات المتاحة</h2>
        <div id="listings-container" class="listings-grid" style="margin-top: 15px;">
            <div class="loading">جاري تحميل الإعلانات...</div>
        </div>
    </main>

    <!-- التذييل -->
    <footer class="main-footer" style="text-align: center; padding: 20px; margin-top: 40px; background: #edf2f7; color: #4a5568;">
        <p>جميع الحقوق محفوظة © منصة RAADI 2026</p>
    </footer>

    <!-- سكربتات الاتصال وقاعدة البيانات -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase.js"></script>
    <script src="script.js"></script>

</body>
</html>
