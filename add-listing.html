<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إضافة إعلان جديد - RAADI</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="main-header">
        <div class="container">
            <h1>منصة الإعلانات RAADI</h1>
            <nav>
                <a href="index.html">الرئيسية</a>
                <a href="add-listing.html" class="active">نشر إعلان جديد</a>
            </nav>
        </div>
    </header>

    <main class="container main-content">
        <h2>إضافة إعلان جديد</h2>
        <form id="add-listing-form" class="add-form">
            <div class="form-group">
                <label for="title">عنوان الإعلان</label>
                <input type="text" id="title" required>
            </div>
            <div class="form-group">
                <label for="description">التفاصيل والوصف</label>
                <textarea id="description" rows="4" required></textarea>
            </div>
            <div class="form-group">
                <label for="price">السعر ($)</label>
                <input type="number" id="price">
            </div>
            <div class="form-group">
                <label for="city">المدينة</label>
                <input type="text" id="city" required>
            </div>
            <div class="form-group">
                <label for="category">التصنيف</label>
                <select id="category">
                    <option value="real-estate">عقارات</option>
                    <option value="vehicles">مركبات</option>
                    <option value="electronics">إلكترونيات</option>
                </select>
            </div>
            <div class="form-group">
                <label for="image_url">رابط الصورة</label>
                <input type="url" id="image_url" placeholder="https://...">
            </div>
            <button type="submit" class="btn-submit">نشر الإعلان</button>
        </form>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase.js"></script>
    <script>
        document.getElementById('add-listing-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const title = document.getElementById('title').value;
            const description = document.getElementById('description').value;
            const price = parseFloat(document.getElementById('price').value) || 0;
            const city = document.getElementById('city').value;
            const category = document.getElementById('category').value;
            const image_url = document.getElementById('image_url').value;

            const { data, error } = await raadiDB
                .from('listings')
                .insert([{ title, description, price, city, category, image_url, status: 'pending' }]);

            if (error) {
                alert('حدث خطأ أثناء الإرسال: ' + error.message);
            } else {
                alert('تم إرسال إعلانك بنجاح وهو بانتظار الموافقة!');
                window.location.href = 'index.html';
            }
        });
    </script>
</body>
</html>
